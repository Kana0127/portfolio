ja:
  # Rails 標準のバリデーションエラー文（rails-i18n 相当を必要分だけ定義）
  errors:
    format: "%{attribute}%{message}"

    messages:
      blank: "を入力してください"
      required: "を入力してください"
      present: "は入力しないでください"
      taken: "はすでに使用されています"
      inclusion: "は一覧にありません"
      exclusion: "は予約されています"
      invalid: "は不正な値です"
      confirmation: "と%{attribute}の入力が一致しません"
      accepted: "を受諾してください"
      empty: "を入力してください"
      too_long: "は%{count}文字以内で入力してください"
      too_short: "は%{count}文字以上で入力してください"
      wrong_length: "は%{count}文字で入力してください"
      not_a_number: "は数値で入力してください"
      not_an_integer: "は整数で入力してください"
      greater_than: "は%{count}より大きい値にしてください"
      greater_than_or_equal_to: "は%{count}以上の値にしてください"
      less_than: "は%{count}より小さい値にしてください"
      less_than_or_equal_to: "は%{count}以下の値にしてください"
      equal_to: "は%{count}にしてください"
      other_than: "は%{count}以外の値にしてください"

  activerecord:
    errors:
      messages:
        record_invalid: "バリデーションに失敗しました: %{errors}"
        restrict_dependent_destroy:
          has_one: "%{record}が存在しているため削除できません"
          has_many: "%{record}が存在しているため削除できません"

      # モデル固有のカスタムバリデーション文
      models:
        roadmap_goal:
          attributes:
            target_month:
              before_start_month: "は開始月以降を選択してください"
              duration_too_short: "は開始月から%{count}か月以上先を選択してください"
              duration_too_long: "は開始月から%{count}か月以内を選択してください"

